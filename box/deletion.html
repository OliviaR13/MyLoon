<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12110f" media="(prefers-color-scheme: dark)">
  <meta name="description" content="账号注销冷静期：查看删除日期，继续注销或取消注销。">
  <link rel="icon" href="./icon.png" type="image/png">
  <title>注销账号 · OliviaR13's Loon Box</title>
  <script>(function(d){var s={};try{s=JSON.parse(localStorage.getItem("myloon_box_settings")||"{}")}catch(e){}
    if(s.theme==="light"||s.theme==="dark")d.dataset.theme=s.theme;if(s.reduceMotion)d.setAttribute("data-reduce-motion","")})(document.documentElement)</script>
  <link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./styles/base.css">
  <style>
    .doc{user-select:text;-webkit-user-select:text}
    .card{margin-top:18px;padding:20px 18px 18px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card);
      box-shadow:0 10px 30px rgb(var(--shadow) / .08);animation:rise .5s var(--spring) both}
    .card[hidden]{display:none}
    @keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
    @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .hero{display:flex;align-items:center;gap:16px}
    .ring{position:relative;flex:none;width:104px;height:104px}
    .ring svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
    .ring circle{fill:none;stroke-width:8;stroke-linecap:round}
    .ring .track{stroke:var(--line)}
    .ring .bar{stroke:var(--accent);stroke-dasharray:314;stroke-dashoffset:314;transition:stroke-dashoffset 1.1s var(--ease) .15s}
    .ring-num{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1}
    .ring-num b{font-size:32px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
    .ring-num span{margin-top:4px;font-size:12px;color:var(--muted);font-weight:500}
    .hero-text{min-width:0}
    .pill{display:inline-block;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent-text);font-size:12px;font-weight:650}
    .hero-text h2{margin:8px 0 4px;font-size:18px;line-height:1.3;font-weight:650;letter-spacing:-.02em;text-wrap:balance}
    .hero-text p{margin:0;font-size:13.5px;line-height:1.55;color:var(--muted)}
    .meta{display:grid;gap:0;margin:18px 0 0;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
    .meta div{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;font-size:14px}
    .meta div + div{border-top:1px solid var(--line)}
    .meta dt{color:var(--muted);flex:none}
    .meta dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
    .hint{margin:14px 0 0;font-size:13px;line-height:1.65;color:var(--muted)}
    .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
    .actions .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
    .actions .btn-primary{flex:1 1 140px}
    .actions .btn-ghost{flex:1 1 140px}
    .fold{display:grid;grid-template-rows:0fr;transition:grid-template-rows .42s var(--ease)}
    .fold[data-open]{grid-template-rows:1fr}
    .fold-in{min-height:0;overflow:hidden;opacity:0;transition:opacity .25s}
    .fold[data-open] .fold-in{opacity:1;transition-delay:.08s}
    .fold-box{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--chip)}
    .fold-box p{margin:0;font-size:13.5px;line-height:1.65}
    .fold-box .actions{margin-top:12px;justify-content:flex-end}
    .fold-box .actions .btn{flex:0 0 auto}
    .err{margin:14px 0 0;color:#c0392b;font-size:14px;line-height:1.55;animation:pop .3s var(--ease)}
    .err[hidden]{display:none}
    @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{color:#ff8a7a}}
    :root[data-theme="dark"] .err{color:#ff8a7a}
    .spin{display:none;width:14px;height:14px;border:2px solid color-mix(in srgb,currentColor 35%,transparent);border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite}
    .btn[data-busy] .spin{display:inline-block}
    .btn[data-busy]:disabled{opacity:.85}
    @keyframes spin{to{transform:rotate(360deg)}}
    .state{text-align:center;padding:26px 18px}
    .state p{margin:0 0 4px;font-size:15px;line-height:1.6}
    .state .sub{font-size:13px;color:var(--muted)}
    .state .actions{justify-content:center}
    .state .actions .btn{flex:0 0 auto}
    .sk{margin-top:18px;padding:20px 18px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card)}
    .sk i{display:block;border-radius:8px;background:linear-gradient(90deg,var(--chip) 25%,color-mix(in srgb,var(--chip) 55%,var(--card)) 50%,var(--chip) 75%);background-size:200% 100%;animation:shimmer 1.3s linear infinite}
    .sk .l1{width:55%;height:16px}.sk .l2{width:80%;height:12px;margin-top:12px}.sk .l3{width:100%;height:84px;margin-top:20px}
    @keyframes shimmer{to{background-position:-200% 0}}
    .done{text-align:center;padding:30px 18px}
    .done h2{margin:6px 0 6px;font-size:18px;font-weight:650;letter-spacing:-.02em}
    .done p{margin:0;font-size:14px;color:var(--muted)}
    .check{display:block;width:56px;height:56px;margin:0 auto 10px;fill:none;stroke:var(--accent);stroke-linecap:round;stroke-linejoin:round}
    .check circle{stroke-width:2.5;stroke-dasharray:151;stroke-dashoffset:151;animation:draw .6s var(--ease) .05s forwards}
    .check path{stroke-width:3;stroke-dasharray:36;stroke-dashoffset:36;animation:draw .4s var(--ease) .5s forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    @media (max-width:380px){.hero{flex-direction:column;align-items:flex-start}}
    html[data-reduce-motion] *,html[data-reduce-motion] *::before,html[data-reduce-motion] *::after{animation-duration:.01ms !important;animation-delay:0s !important;transition-duration:.01ms !important;transition-delay:0s !important}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-delay:0s !important;transition-duration:.01ms !important;transition-delay:0s !important}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="head">
      <a href="./" aria-label="返回首页"><img class="logo" src="./icon.png" alt="" width="44" height="44"></a>
      <div class="head-text">
        <h1><span class="h1-eyebrow">OliviaR13's</span>注销账号</h1>
        <p>冷静期内可以取消</p>
      </div>
    </header>
    <article class="doc">
      <div class="sk" id="loading" role="status" aria-live="polite" aria-label="正在读取注销状态"><i class="l1"></i><i class="l2"></i><i class="l3"></i></div>

      <section class="card state" id="errorBox" hidden>
        <p id="errorText"></p>
        <p class="sub" id="errorSub"></p>
        <div class="actions">
          <button class="btn btn-ghost" id="retryBtn" type="button" hidden>重试</button>
          <a class="btn btn-primary" href="./">返回首页</a>
        </div>
      </section>

      <section class="card" id="panel" hidden>
        <div class="hero">
          <div class="ring" aria-hidden="true">
            <svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="50"/><circle class="bar" id="ringBar" cx="60" cy="60" r="50"/></svg>
            <div class="ring-num"><b id="days">0</b><span id="daysUnit">天</span></div>
          </div>
          <div class="hero-text">
            <span class="pill">冷静期中</span>
            <h2 id="headline"></h2>
            <p>在此之前，可以随时取消注销。</p>
          </div>
        </div>
        <dl class="meta">
          <div><dt>申请时间</dt><dd id="requested"></dd></div>
          <div><dt>永久删除时间</dt><dd id="scheduled"></dd></div>
        </dl>
        <p class="hint">到期后，账号、通行密钥、云端收藏、插件设置和其他云端数据会被永久删除，无法恢复。本机浏览器里的数据不受影响。</p>
        <p id="actionError" class="err" role="alert" hidden></p>
        <div class="actions">
          <button class="btn btn-primary" id="cancelBtn" type="button" aria-expanded="false" aria-controls="cancelFold">取消注销</button>
          <button class="btn btn-ghost" id="continueBtn" type="button"><i class="spin" aria-hidden="true"></i><span>保持注销并返回</span></button>
        </div>
        <div class="fold" id="cancelFold">
          <div class="fold-in" inert>
            <div class="fold-box">
              <p>取消后，账号会恢复正常使用，原来的 14 天不再保留。之后想再注销，需要重新申请，并重新计算 14 天。</p>
              <div class="actions">
                <button class="btn btn-ghost" id="cancelNo" type="button">先不取消</button>
                <button class="btn btn-primary" id="cancelYes" type="button"><i class="spin" aria-hidden="true"></i><span>确认取消注销</span></button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="card done" id="doneBox" hidden>
        <svg class="check" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="24"/><path d="M17 29l8 8 14-16"/></svg>
        <h2>账号已恢复</h2>
        <p role="status">已取消注销，正在带你回到首页…</p>
      </section>
    </article>
  </main>
  <script type="module" src="./js/deletion.js"></script>
</body>
</html>
