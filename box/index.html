<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)">
  <meta name="description" content="MyLoon Box：浏览、搜索 OliviaR13 整理的 Loon 插件，并一键安装到 Loon。">
  <title>MyLoon Box</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!--
    Icon set: authored inline SVG, one family, stroke-width 1.6, 24px grid.
    No icon library: this page ships dependency-free and has no build step, so a
    runtime-unavailable package would break rendering offline. Authored SVG keeps
    the stroke weight consistent, which is what the consistency rule actually asks for.
  -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="6.5"/><path d="M16.2 16.2 20.5 20.5"/>
    </symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24">
      <path d="M4.2 10A8 8 0 0 1 17.9 5.4"/><path d="M19.8 14a8 8 0 0 1-13.7 4.6"/>
      <path d="M17.7 3.4V9H12.1"/><path d="M6.3 20.6V15H12"/>
    </symbol>
    <symbol id="i-external" viewBox="0 0 24 24">
      <path d="M14 5h5v5"/><path d="M19 5l-7.6 7.6"/>
      <path d="M18 14.4V18A1.5 1.5 0 0 1 16.5 19.5h-10A1.5 1.5 0 0 1 5 18V7.5A1.5 1.5 0 0 1 6.5 6h3.6"/>
    </symbol>
    <symbol id="i-install" viewBox="0 0 24 24">
      <path d="M12 4v10"/><path d="M8 10.4l4 4 4-4"/><path d="M5 18.5h14"/>
    </symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8"/><path d="M12 8.2v4.4"/>
      <circle cx="12" cy="16" r=".9" fill="currentColor" stroke="none"/>
    </symbol>
  </svg>

  <a class="skip-link" href="#results">跳到插件列表</a>

  <main class="shell">

    <header class="masthead">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">ML</span>
        <div class="brand-copy">
          <h1>MyLoon Box</h1>
          <p>OliviaR13 整理的 Loon 插件清单，每条规则都经过抓包验证。</p>
        </div>
      </div>
      <div class="masthead-actions">
        <a class="btn btn-ghost" href="https://github.com/OliviaR13/MyLoon" target="_blank" rel="noreferrer">
          <svg class="ico" aria-hidden="true"><use href="#i-external"/></svg>
          <span>源码仓库</span>
        </a>
        <button class="btn btn-ghost btn-icon" id="refreshBtn" type="button">
          <svg class="ico" aria-hidden="true"><use href="#i-refresh"/></svg>
          <span class="sr-only">刷新清单</span>
        </button>
      </div>
    </header>

    <section class="toolbar" aria-label="搜索与筛选">
      <div class="search">
        <svg class="ico search-ico" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="searchInput" type="search" autocomplete="off" aria-label="搜索插件"
               placeholder="搜索插件名称、描述或作者">
        <kbd id="kbdHint">Ctrl K</kbd>
      </div>
      <div class="filters" id="filters" role="group" aria-label="按分类筛选"></div>
    </section>

    <p class="meta" id="metaRow">
      <span id="countText">正在加载清单</span>
      <span id="updatedText"></span>
    </p>

    <section id="results" class="results" aria-live="polite" aria-busy="true"></section>

    <noscript>
      <p class="notice notice-alert">
        插件清单需要 JavaScript 才能加载。你也可以直接打开
        <a href="https://github.com/OliviaR13/MyLoon/tree/main/plugin">GitHub 上的 plugin 目录</a>
        手动复制 raw 链接到 Loon。
      </p>
    </noscript>

    <footer class="site-footer">
      <span>MyLoon</span>
      <span class="sep" aria-hidden="true">/</span>
      <span>开源 Loon 插件合集</span>
    </footer>

  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <template id="rowTpl">
    <article class="plugin">
      <img class="plugin-icon" alt="" loading="lazy" width="44" height="44">
      <div class="plugin-body">
        <div class="plugin-title">
          <h2 class="plugin-name"></h2>
          <span class="chip chip-version"></span>
        </div>
        <p class="plugin-desc"></p>
        <div class="plugin-foot">
          <span class="chip chip-cat"></span>
          <span class="plugin-author"></span>
          <button class="link-btn plugin-toggle" type="button" aria-expanded="false">
            <span class="toggle-label">展开全文</span>
            <svg class="ico ico-sm" aria-hidden="true"><use href="#i-chevron"/></svg>
          </button>
        </div>
      </div>
      <button class="btn btn-primary plugin-install" type="button">
        <svg class="ico" aria-hidden="true"><use href="#i-install"/></svg>
        <span>安装</span>
      </button>
    </article>
  </template>

  <script src="./app.js"></script>
</body>
</html>
