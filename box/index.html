<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f7f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1110" media="(prefers-color-scheme: dark)">
  <meta name="description" content="OliviaR13's Loon Box：浏览、搜索 Loon 插件，并一键安装到 Loon。">
  <link rel="icon" href="./icon.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="OliviaR13's Loon Box">
  <meta property="og:description" content="浏览、搜索 Loon 插件，并一键安装到 Loon。">
  <title>OliviaR13's Loon Box</title>
  <script>try{var t=JSON.parse(localStorage.getItem("myloon_box_settings")||"{}").theme;if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./style.css">
  <!-- 不需要人机验证：把 app.js 里 CONFIG.turnstile.siteKey 设为空字符串，并删除下面这行 -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
</head>
<body>
  <a class="skip" href="#results">跳到插件列表</a>
  <main class="shell">
    <header class="head">
      <img class="logo" src="./icon.png" alt="" width="44" height="44">
      <div class="head-text">
        <h1><span class="h1-eyebrow">OliviaR13's</span> Loon Box</h1>
        <p>Loon 插件清单，点击即可安装</p>
      </div>
      <button class="btn btn-ghost btn-icon" id="refreshBtn" type="button" disabled aria-label="刷新清单">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
      </button>
      <button class="btn btn-ghost btn-icon" id="settingsBtn" type="button" aria-label="设置" aria-haspopup="dialog">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
      </button>
    </header>

    <div class="tabs" id="tabs" role="group" aria-label="切换视图">
      <button class="tab" type="button" data-view="all" aria-pressed="true">全部插件</button>
      <button class="tab" type="button" data-view="fav" aria-pressed="false">我的收藏<small id="favCount">0</small></button>
    </div>

    <div class="toolbar">
      <div class="search">
        <input id="searchInput" type="search" autocomplete="off" placeholder="搜索插件名称或描述" aria-label="搜索插件">
      </div>
      <div class="sort" id="sortBox" role="group" aria-label="排序方式"></div>
    </div>
    <div class="filters" id="filters" role="group" aria-label="按分类筛选"></div>


    <p class="meta"><span id="countText">请完成人机验证以加载插件列表</span><span id="updatedText"></span></p>
    <section id="results" class="list" aria-live="polite" aria-busy="false"></section>

    <noscript>
      <p class="notice">插件清单需要 JavaScript。也可以直接打开
        <a href="https://github.com/OliviaR13/MyLoon/tree/main/plugin">GitHub 的 plugin 目录</a>复制 raw 链接到 Loon。</p>
    </noscript>

    <footer class="foot">OliviaR13's Loon Box · <a href="https://github.com/OliviaR13/MyLoon">GitHub</a> · <a href="https://github.com/OliviaR13/MyLoon/blob/main/LICENSE">版权与许可</a></footer>
  </main>

  <dialog class="sheet" id="settings" aria-labelledby="settingsTitle">
    <div class="sheet-head">
      <h2 id="settingsTitle" tabindex="-1" autofocus>设置</h2>
      <button class="btn btn-ghost" id="settingsClose" type="button">完成</button>
    </div>
    <div class="sheet-body">
      <h3 class="group-title">账号</h3>
      <div class="group">
        <div class="row" id="loginRow">
          <span>GitHub</span>
          <a class="btn btn-primary" id="loginBtn" href="/api/auth/login">立即登录</a>
        </div>
        <div class="row" id="accountRow" hidden>
          <span class="acct"><img id="acctAvatar" alt="" width="26" height="26"><span id="acctName"></span></span>
          <button class="btn btn-ghost" id="logoutBtn" type="button">退出登录</button>
        </div>
        <div class="row"><span>云端同步</span>
          <span class="row-actions">
            <span class="muted" id="syncState">未登录</span>
            <button class="btn btn-ghost" id="syncNowBtn" type="button" hidden>立即同步</button>
          </span>
        </div>
      </div>

      <h3 class="group-title">外观</h3>
      <div class="group">
        <div class="theme-tiles" role="group" aria-label="主题">
          <button type="button" class="tile" data-theme-opt="system"><span class="tile-prev prev-auto" aria-hidden="true"><i></i><i></i><i></i></span><span class="tile-label">跟随系统</span></button>
          <button type="button" class="tile" data-theme-opt="light"><span class="tile-prev prev-light" aria-hidden="true"><i></i><i></i><i></i></span><span class="tile-label">浅色</span></button>
          <button type="button" class="tile" data-theme-opt="dark"><span class="tile-prev prev-dark" aria-hidden="true"><i></i><i></i><i></i></span><span class="tile-label">深色</span></button>
        </div>
      </div>

      <h3 class="group-title">插件卡片</h3>
      <div class="group">
        <div class="row"><span>显示描述</span><button class="switch" type="button" role="switch" data-switch="showDesc" aria-label="显示描述"></button></div>
        <div class="row"><span>显示版本号</span><button class="switch" type="button" role="switch" data-switch="showVer" aria-label="显示版本号"></button></div>
        <div class="row"><span>收藏置顶</span><button class="switch" type="button" role="switch" data-switch="pinFavs" aria-label="收藏置顶"></button></div>
        <div class="row"><span>显示分类标签</span><button class="switch" type="button" role="switch" data-switch="showCat" aria-label="显示分类标签"></button></div>
      </div>

      <h3 class="group-title">数据</h3>
      <div class="group">
        <button class="row row-btn row-danger" id="clearBtn" type="button"><span>清除本地设置</span></button>
        <div class="row row-confirm" id="clearConfirm" hidden>
          <span class="muted">将恢复主题、显示项和排序的默认值，不影响 GitHub 上的插件。</span>
          <span class="row-actions"><button class="btn btn-ghost" id="clearCancel" type="button">取消</button><button class="btn btn-primary" id="clearOk" type="button">清除</button></span>
        </div>
      </div>

      <h3 class="group-title">关于</h3>
      <div class="group">
        <div class="row"><span>插件数量</span><span class="muted" id="aboutCount">-</span></div>
        <div class="row"><span>清单更新</span><span class="muted" id="aboutDate">-</span></div>
        <a class="row row-btn" href="https://github.com/OliviaR13/MyLoon" target="_blank" rel="noreferrer"><span>GitHub</span><span class="muted">OliviaR13/MyLoon</span></a>
        <a class="row row-btn" href="https://github.com/OliviaR13/MyLoon/blob/main/LICENSE" target="_blank" rel="noreferrer"><span>许可</span><span class="muted">保留所有权利</span></a>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"><span class="toast-msg"></span><button class="toast-act" type="button" hidden></button></div>

  <template id="rowTpl">
    <article class="card">
      <img class="card-icon" alt="" loading="lazy" width="44" height="44">
      <div class="card-body">
        <div class="card-title"><h2></h2><span class="chip chip-ver"></span></div>
        <p class="card-desc" data-open="false"></p>
        <button class="more" type="button" aria-expanded="false" hidden>展开</button>
        <div class="tags"></div>
      </div>
      <div class="card-actions">
        <button class="btn btn-primary act-install" type="button">安装</button>
        <button class="btn btn-ghost act-copy" type="button">复制链接</button>
      </div>
    </article>
  </template>

  <script src="./app.js"></script>
  <script src="./settings.js"></script>
  <script src="./account.js"></script>
</body>
</html>
