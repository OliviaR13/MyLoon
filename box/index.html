<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0c">
  <meta name="description" content="MyLoon · Loon 插件盒子">
  <title>MyLoon Box</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>

  <main class="shell">
    <header class="hero">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div>
          <div class="eyebrow">MYLOON BOX</div>
          <h1>插件盒子</h1>
          <p>精选 Loon 插件 · 搜索 · 一键安装</p>
        </div>
      </div>
      <div class="hero-actions">
        <a class="icon-btn" href="https://github.com/OliviaR13/MyLoon" target="_blank" rel="noreferrer" aria-label="GitHub">↗</a>
        <button class="icon-btn" id="refreshBtn" aria-label="刷新">↻</button>
      </div>
    </header>

    <section class="toolbar">
      <label class="search">
        <span>⌕</span>
        <input id="searchInput" type="search" placeholder="搜索插件名称、描述…" autocomplete="off">
        <kbd>⌘ K</kbd>
      </label>
      <div class="filters" id="filters"></div>
    </section>

    <section class="meta-row">
      <span id="countText">正在加载…</span>
      <span id="updatedText"></span>
    </section>

    <section id="pluginGrid" class="grid" aria-live="polite"></section>

    <div id="empty" class="empty hidden">
      <div class="empty-icon">⌕</div>
      <h2>没有找到插件</h2>
      <p>换个关键词或清除筛选试试。</p>
    </div>

    <footer>
      <span>MyLoon</span>
      <span>·</span>
      <span>Open source · Loon plugins</span>
    </footer>
  </main>

  <script src="./app.js"></script>
</body>
</html>
