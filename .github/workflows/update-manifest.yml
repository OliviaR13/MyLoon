name: Update MyLoon Box

on:
  push:
    branches: [main]
    paths:
      - "plugin/*.plugin"
      - "box/**"
      - "manifest.json"
      - ".github/workflows/update-manifest.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: myloon-pages
  # 部署流程不做抢占取消：连续提交时掐掉进行中的 deploy
  # 只会让 Pages 的上线顺序变得不可预测，排队等它跑完更安全
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ========================================
      # 1. 获取仓库
      # ========================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ========================================
      # 2. 自动生成 manifest.json
      # ========================================
      - name: Generate manifest
        shell: python
        run: |
          import json
          import re
          from pathlib import Path
          from datetime import datetime, timezone

          root = Path("plugin")
          plugins = []

          # ----------------------------------------
          # 内置分类映射
          # 用于没有填写 #!category 的旧插件
          # ----------------------------------------
          categories = {
              "Gemini": "代理分流",
              "Spotify": "代理分流",
              "douyin_ip": "IP 属地",
              "weibo_ip": "IP 属地",
              "outlook": "登录修复",
          }

          # ----------------------------------------
          # 读取插件元数据
          # ----------------------------------------
          def meta(text, key):
              pattern = r"^#!" + re.escape(key) + r"\s*=\s*(.+?)\s*$"
              match = re.search(pattern, text, re.MULTILINE)

              if match:
                  return match.group(1).strip()

              return None

          # ----------------------------------------
          # 扫描所有 .plugin
          # ----------------------------------------
          for path in sorted(root.glob("*.plugin")):
              text = path.read_text(encoding="utf-8")

              # 插件自己的 category 优先
              # 没有 category 时使用内置映射
              category = (
                  meta(text, "category")
                  or categories.get(path.stem, "其他")
              )

              plugins.append({
                  "id": path.stem,

                  "name": (
                      meta(text, "name")
                      or path.stem
                  ),

                  "file": path.as_posix(),

                  "version": meta(text, "version"),

                  "author": (
                      meta(text, "author")
                      or "MyLoon"
                  ),

                  "category": category,

                  "icon": meta(text, "icon"),

                  "description": (
                      meta(text, "desc")
                      or "Loon 插件"
                  ),
              })

          # ----------------------------------------
          # 生成 manifest
          # ----------------------------------------
          manifest = {
              "name": "MyLoon",

              "description": (
                  "OliviaR13 的 Loon 插件合集与一键安装盒子"
              ),

              "repository": (
                  "https://github.com/OliviaR13/MyLoon"
              ),

              "rawBase": (
                  "https://raw.githubusercontent.com/"
                  "OliviaR13/MyLoon/main/"
              ),

              "generatedAt": (
                  datetime.now(timezone.utc).isoformat()
              ),

              "plugins": plugins,
          }

          # ----------------------------------------
          # 写入 manifest.json
          # ----------------------------------------
          Path("manifest.json").write_text(
              json.dumps(
                  manifest,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          print(
              f"Generated manifest with {len(plugins)} plugins."
          )

          for plugin in plugins:
              print(
                  f"- {plugin['name']} "
                  f"[{plugin['category']}]"
              )

      # ========================================
      # 3. 提交 manifest.json
      # ========================================
      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add manifest.json

          if git diff --cached --quiet; then
            echo "manifest.json unchanged"
          else
            git commit -m "chore: update plugin manifest"
            # 必须用默认的 GITHUB_TOKEN：它推送产生的事件不会触发新的 workflow run。
            # 一旦换成 PAT，上面 generatedAt 每次都是新时间戳 → manifest 永远有 diff
            # → 提交 → 触发新一轮 → 无限循环，几分钟就能烧完 Actions 额度。
            git push
          fi

      # ========================================
      # 4. 配置 GitHub Pages
      # ========================================
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # ========================================
      # 5. 准备 Pages 网站
      # ========================================
      - name: Prepare Pages site
        run: |
          rm -rf _site
          mkdir -p _site

          cp -R box/. _site/
          cp manifest.json _site/manifest.json

      # ========================================
      # 6. 上传 Pages Artifact
      # ========================================
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # ========================================
      # 7. 部署 GitHub Pages
      # ========================================
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
