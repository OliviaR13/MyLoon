name: Update manifest

on:
  push:
    branches: [main]
    paths:
      - "plugin/*.plugin"
      - ".github/workflows/update-manifest.yml"
      - ".github/tools/update_readme.py"
      - ".github/plugins-i18n.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-manifest
  # 不取消进行中的运行：连续提交时让它们排队，避免两次运行同时提交 manifest.json
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ========================================
      # 1. 获取仓库
      # ========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ========================================
      # 2. 自动生成 manifest.json
      # ========================================
      - name: Generate manifest
        shell: python
        run: |
          import json
          import re
          from pathlib import Path
          from datetime import datetime, timezone

          root = Path("plugin")
          plugins = []

          # ----------------------------------------
          # 内置分类映射（兜底）
          # 仅用于没有填写 #!tag 的插件，键为文件名（不含扩展名）
          # ----------------------------------------
          categories = {
              "Gemini": "代理分流",
              "Spotify": "代理分流",
              "Twitter": "代理分流",
              "douyin_ip": "IP 属地",
              "rednotebook_ip": "IP 属地",
              "weibo": "IP 属地",
              "outlook": "登录修复",
          }

          # ----------------------------------------
          # 读取插件元数据
          # ----------------------------------------
          def meta(text, key):
              pattern = r"^#!" + re.escape(key) + r"\s*=\s*(.+?)\s*$"
              match = re.search(pattern, text, re.MULTILINE)

              if match:
                  return match.group(1).strip()

              return None

          # ----------------------------------------
          # 扫描所有 .plugin
          # ----------------------------------------
          for path in sorted(root.glob("*.plugin")):
              text = path.read_text(encoding="utf-8")

              # 优先读取插件头部的 #!tag（Loon 官方字段，可用英文逗号写多个）
              # 盒子分类取第一个标签；没有 #!tag 时使用内置映射
              tag = meta(text, "tag")
              tags = [x.strip() for x in tag.split(",") if x.strip()] if tag else []
              category = (
                  tags[0] if tags else None
              ) or categories.get(path.stem, "其他")

              plugins.append({
                  "id": path.stem,

                  "name": (
                      meta(text, "name")
                      or path.stem
                  ),

                  "file": path.as_posix(),

                  "version": meta(text, "version"),

                  "author": (
                      meta(text, "author")
                      or "MyLoon"
                  ),

                  "category": category,

                  "tags": tags,

                  "date": meta(text, "date"),

                  "homepage": meta(text, "homepage"),

                  "icon": meta(text, "icon"),

                  "description": (
                      meta(text, "desc")
                      or "Loon 插件"
                  ),
              })

          # ----------------------------------------
          # 生成 manifest
          # ----------------------------------------
          manifest = {
              "name": "MyLoon",

              "description": (
                  "OliviaR13 的 Loon 插件合集与一键安装盒子"
              ),

              "repository": (
                  "https://github.com/OliviaR13/MyLoon"
              ),

              "rawBase": (
                  "https://raw.githubusercontent.com/"
                  "OliviaR13/MyLoon/main/"
              ),

              "generatedAt": (
                  datetime.now(timezone.utc).isoformat()
              ),

              "plugins": plugins,
          }

          # ----------------------------------------
          # 写入 manifest.json
          # ----------------------------------------
          Path("manifest.json").write_text(
              json.dumps(
                  manifest,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          print(
              f"Generated manifest with {len(plugins)} plugins."
          )

          for plugin in plugins:
              print(
                  f"- {plugin['name']} "
                  f"[{plugin['category']}]"
              )

      # ========================================
      # 3. 同步 README 的插件表与数量
      #    只改 README 中 <!-- PLUGINS_ZH/EN:START --> ... <!-- ...:END --> 之间的内容和数量，
      #    英文名与说明从 .github/plugins-i18n.json 读取。
      # ========================================
      - name: Update README
        run: python3 .github/tools/update_readme.py

      # ========================================
      # 4. 提交 manifest.json 与 README.md
      # ========================================
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add manifest.json README.md

          if git diff --cached --quiet; then
            echo "manifest.json and README.md unchanged"
          else
            git commit -m "chore: update plugin manifest and README"
            # 必须用默认的 GITHUB_TOKEN：它推送产生的事件不会触发新的 workflow run。
            # 一旦换成 PAT，上面 generatedAt 每次都是新时间戳 → manifest 永远有 diff
            # → 提交 → 触发新一轮 → 无限循环，几分钟就能烧完 Actions 额度。
            git pull --rebase
            git push
          fi
