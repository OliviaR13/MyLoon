name: Sync Gemini models

on:
  schedule:
    - cron: "17 2 * * *"   # 每天 UTC 02:17（北京时间 10:17）
  workflow_dispatch:

permissions:
  contents: write
  actions: write            # 用来在更新后触发 update-manifest 工作流

concurrency:
  group: sync-gemini-models
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync model dropdown
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 .github/tools/sync_gemini_models.py

      - name: Commit and push
        id: commit
        run: |
          if git diff --quiet -- plugin/qianwen_gemini.plugin; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "没有变化，无需提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin/qianwen_gemini.plugin
          git commit -m "chore: sync Gemini model options"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN 推送不会自动触发其他工作流，这里手动触发 manifest/README 更新
      - name: Trigger manifest update
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-manifest.yml --ref main
